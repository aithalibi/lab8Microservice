# =====================================================================
# TP 8 - Spring @RestController
# Etape 2 : configuration de la base de donnees H2 et du port
# =====================================================================
spring.application.name=ms-banque
server.port=8082

# --- Source de donnees H2 en memoire ---------------------------------
spring.datasource.url=jdbc:h2:mem:banque;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Console H2 (developpement) --------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate -------------------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Format des dates dans le JSON -----------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Paris

# --- Swagger / springdoc-openapi (etape 8) ---------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
